<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VA Comics // PROJECTS // ARCHIVE_FILES</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .projects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 30px;
            width: 100%;
            max-width: 1200px;
        }

        .project-card {
            padding: 20px;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .project-card:hover {
            border-color: var(--magma-orange) !important;
            box-shadow: 0 0 15px rgba(255, 69, 0, 0.2);
            transform: translateY(-5px);
        }

        .project-cover-preview {
            width: 100%;
            height: 400px;
            background-color: #000000;
            border: 1px solid #111;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            margin-bottom: 20px;
        }

        .project-cover-preview img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .project-info h2 {
            font-size: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
            color: var(--text-colorless);
        }

        .project-info p {
            font-size: 14px;
            color: var(--terminal-gray);
            line-height: 1.6;
            margin-bottom: 20px;
            height: 70px;
            overflow: hidden;
        }

        .btn-enter {
            display: block;
            text-align: center;
            background: transparent;
            border: 1px solid var(--terminal-gray);
            color: var(--text-colorless);
            text-decoration: none;
            padding: 12px;
            font-size: 13px;
            font-weight: bold;
            letter-spacing: 2px;
            text-transform: uppercase;
            transition: all 0.3s ease;
        }

        .project-card:hover .btn-enter {
            border-color: var(--magma-orange);
            color: var(--magma-orange);
            background: #000;
        }
    </style>
</head>
<body class="content-page">

    <div class="bunker-bg-overlay"></div>

    <button class="mobile-bunker-toggle">
        [ = ] SYS_MENU
    </button>

    <div class="os-container">
        
        <nav class="sidebar-nav" id="globalNav"></nav>
    <script src="/site.js"></script>

        <div class="content-wrapper">
            <div class="projects-grid">
                <div class="project-card">
                    <div class="project-cover-preview">
                        <img src="deaddrop/assets/deaddroppj.webp" alt="Dead Drop Vol 1 Cover" onerror="this.src='https://via.placeholder.com/300x400/050505/ff4500?text=DEAD+DROP'">
                    </div>
                    <div class="project-info">
                        <h2>DEAD DROP Comic books</h2>
                        <p>A violent, uncensored tech-noir. Follow the operatives through the underground of a system in total collapse. Volumes 1 and 2 available now.</p>
                        <a href="/deaddrop/index.html" class="btn-enter">[ ACCESS_DATABASE ]</a>
                    </div>
                </div>
            </div>
        </div>

        <footer class="bunker-footer" id="siteFooter"></footer>

    </div>

    
</body>
</html>
