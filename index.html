<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VA Comics</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* ============================================================
           RESPONSIVE VIDEO BACKGROUND // DESKTOP & MOBILE
        ============================================================ */
        body.home-page {
            background-color: #000000 !important;
            overflow-x: hidden;
            margin: 0;
            padding: 0;
        }

        .bunker-bg-overlay {
            background-image: none !important;
            background: #000000 !important;
            position: fixed;
            inset: -20px;
            width: calc(100vw + 40px);
            height: calc(100vh + 40px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
            transition: transform 0.1s ease-out;
        }

        .bg-video-stream {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
            filter: brightness(1.15) contrast(1.15);
        }

        /* Automatic switch based on screen width */
        .video-mobile {
            display: none;
        }

        .video-desktop {
            display: block;
        }

        @media (max-width: 1023px) {
            .video-desktop {
                display: none;
            }
            .video-mobile {
                display: block;
            }
        }
    </style>
</head>
<body class="home-page">

    <!-- Responsive video background -->
    <div class="bunker-bg-overlay">
        <!-- Desktop 16:9 -->
        <video class="bg-video-stream video-desktop" autoplay muted loop playsinline preload="auto">
            <source src="introd.mp4" type="video/mp4">
        </video>

        <!-- Mobile 9:16 / Vertical -->
        <video class="bg-video-stream video-mobile" autoplay muted loop playsinline preload="auto">
            <source src="introm.mp4" type="video/mp4">
        </video>
    </div>

    <button class="mobile-bunker-toggle">
        [ = ] SYS_MENU
    </button>

    <div class="os-container">

        <nav class="sidebar-nav" id="globalNav"></nav>
        <script src="/site.js"></script>

        <footer class="bunker-footer" id="siteFooter"></footer>

    </div>

</body>
</html>
