    <style>
        /* CONFIGURAȚIE STATUS PRODUCTION BARBARIAN STYLE */
        .status-container-wrapper {
            max-width: 600px;
            margin-bottom: 40px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .status-uplink {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--dark-fence);
            padding: 15px 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .status-label {
            font-family: 'Courier New', Courier, monospace;
            font-size: 12px;
            color: var(--terminal-gray);
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .progress-bar-hud {
            width: 100%;
            height: 6px;
            background: #111;
            position: relative;
            overflow: hidden;
            border: 1px solid #222;
        }

        .progress-fill-magma {
            width: 65%; /* Nivelul curent de producție */
            height: 100%;
            background: var(--magma-orange);
            box-shadow: 0 0 10px var(--magma-orange);
        }

        .progress-fill-magma.issue13 {
            width: 35%; /* Progresul specific pentru Issue 13 */
        }

        .status-percent {
            font-family: 'Courier New', Courier, monospace;
            font-size: 11px;
            color: var(--magma-orange);
            font-weight: bold;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* GRID CONȚINUT REVELATIONS */
        .issues-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 30px;
            width: 100%;
            max-width: 1200px;
        }

        .issue-card {
            padding: 20px;
            text-align: center;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .issue-card:hover {
            border-color: var(--magma-orange) !important;
            box-shadow: 0 0 15px rgba(255, 69, 0, 0.2);
            transform: translateY(-5px);
        }

        .issue-cover {
            width: 100%;
            aspect-ratio: 2/3;
            object-fit: cover;
            background-color: #000000;
            border: 1px solid #111;
            margin-bottom: 15px;
        }

        .issue-card h3 {
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-colorless);
            margin-bottom: 15px;
            min-height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .buy-options {
            display: flex;
            gap: 10px;
        }

        .btn-buy {
            flex: 1;
            display: block;
            text-align: center;
            background: transparent;
            border: 1px solid var(--dark-fence);
            color: var(--text-colorless);
            text-decoration: none;
            padding: 10px;
            font-size: 11px;
            font-weight: bold;
            letter-spacing: 1px;
            text-transform: uppercase;
            transition: all 0.3s ease;
        }

        .btn-buy:hover:not(.disabled) {
            border-color: var(--text-colorless);
            background: var(--pure-black);
            color: var(--magma-orange);
        }

        /* Stil specific pentru elementele indisponibile (N/A) */
        .btn-buy.disabled {
            opacity: 0.25;
            cursor: not-allowed;
            color: var(--terminal-gray);
            border-color: #151515;
        }

        .volume-header-title {
            font-size: 24px;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--magma-orange);
            margin-bottom: 25px;
            border-bottom: 1px solid var(--dark-fence);
            padding-bottom: 10px;
        }
    </style>
</head>
