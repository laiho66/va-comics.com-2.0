<!DOCTYPE html>

    <!-- SEO (descrierea: maxim 155 de caractere) -->
    <meta name="description" content="Read Dead Drop online. Every available issue, page by page, in the VA Comics reader. Mature readers, 18+.">
    <link rel="canonical" href="https://va-comics.com/media/viewer">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="VA Comics">
    <meta property="og:title" content="Read Dead Drop Online // VA Comics">

<!-- ======================================================================
     VIEWER: biblioteca + cititorul (Etapa 5)

     !!! IMPORTANT (Foundry) !!!
     Blocul <script> de mai jos, cu R2_BASE_URL, buildPages și COMICS_DATABASE, este COPIAT
     EXACT din viewer-ul vechi, ca Foundry să continue să adauge issue-uri în el.
     NU schimba numele, ordinea sau formatul liniilor. Un issue nou = o linie nouă în
     COMICS_DATABASE (virgulă după linia dinainte). Restul (biblioteca, cititorul) se
     face singur în assets/reader.js, deci nu trebuie atins pentru un issue nou.
     Coperta unui issue nou: deaddrop/assets/coverN.webp (N = numărul issue-ului).
     ====================================================================== -->
<body data-bg="deaddrop">

<a class="skip-link" href="#main">Skip to content</a>

<div class="shell">
    <nav class="nav" id="siteNav" aria-label="Main"></nav>
    <script src="/site.js"></script>

    <main class="main" id="main">
        <div id="library" class="stack-lg">
            <div class="page-head">
                <nav class="crumbs" id="crumbs"></nav>
                <div class="title-row"><h1 class="h1">Dead Drop Reader</h1><span class="chip">18+</span></div>
                <p class="lead">Every available issue, page by page. Your place is remembered in this browser.</p>
            </div>
            <div id="resume"></div>
            <div id="volumes" class="stack-lg"></div>
            <noscript><p class="small">The reader needs JavaScript. You can also get every issue on Amazon: <a href="/deaddrop/vol1.html">Volume 1</a> · <a href="/deaddrop/vol2.html">Volume 2</a>.</p></noscript>
        </div>
    </main>
</div>

<footer class="site-footer" id="siteFooter"></footer>

<!-- ===== CITITORUL (ecran complet) ===== -->
<div class="reader" id="reader" hidden role="dialog" aria-modal="true" aria-label="Comic reader">
    <div class="reader-top">
        <div class="reader-top-left">
            <button type="button" class="rbtn" id="rBack">&larr; LIBRARY</button>
            <span class="reader-title" id="rTitle"></span>
        </div>
        <div class="reader-tools">
            <select class="rselect" id="rIssue" aria-label="Choose an issue"></select>
            <button type="button" class="rbtn" id="rZoom">&oplus; ZOOM</button>
            <button type="button" class="rbtn" id="rMap">&#9638; PAGES</button>
            <button type="button" class="rbtn" id="rFull" aria-label="Full screen">&#9974;</button>
        </div>
    </div>

    <div class="reader-main">
        <div class="reader-stage">
            <div class="reader-page" id="rPageBox">
                <img id="rImg" alt="" decoding="async">
                <div class="reader-loading" id="rLoading" hidden>LOADING_PAGE...</div>
            </div>
            <button type="button" class="reader-zone reader-zone--l" id="rZoneL" tabindex="-1" aria-hidden="true"></button>
            <button type="button" class="reader-zone reader-zone--c" id="rZoneC" tabindex="-1" aria-hidden="true"></button>
            <button type="button" class="reader-zone reader-zone--r" id="rZoneR" tabindex="-1" aria-hidden="true"></button>
            <button type="button" class="reader-arrow reader-arrow--l" id="rPrev" aria-label="Previous page">&lsaquo;</button>
            <button type="button" class="reader-arrow reader-arrow--r" id="rNext" aria-label="Next page">&rsaquo;</button>
            <div class="reader-end" id="rEnd" hidden></div>
        </div>
        <aside class="reader-map" id="rMapPanel" hidden aria-label="Page map">
            <div class="reader-map-head"><span>// PAGE_MAP</span><button type="button" class="rbtn" id="rMapClose" aria-label="Close the page map">X</button></div>
            <div class="reader-thumbs" id="rThumbs"></div>
        </aside>
    </div>

    <div class="reader-bottom">
        <span class="reader-count" id="rCount">1 / 1</span>
        <input type="range" id="rRange" min="1" max="1" value="1" aria-label="Page">
        <span class="reader-hint">&larr; &rarr; KEYS &middot; SWIPE ON TOUCH &middot; F = FULL SCREEN</span>
    </div>
</div>

<!-- ===== BAZA DE DATE A ISSUE-URILOR (copiată exact din viewer-ul vechi; o actualizează Foundry) ===== -->
<script>

        // 1. LINK BAZĂ CLOUDFLARE R2
        const R2_BASE_URL = "https://pub-b3a8a09f297e48cfaca67d22b3826089.r2.dev/deaddrop";

        // Generator pagini (page1.webp -> totalPages)
        function buildPages(folderName, totalPages) {
            var pages = [];
            for (var i = 1; i <= totalPages; i++) {
                pages.push(R2_BASE_URL + "/" + folderName + "/page" + i + ".webp");
            }
            return pages;
        }

        // 2. BAZA DE DATE CONFIGURATĂ
        const COMICS_DATABASE = {
            "1":    { title: "Originea // Volumul I", badge: "ISSUE #01", pages: buildPages("issue1", 23) },
            "2":    { title: "Dead Drop: Ghost Mark", badge: "ISSUE #02", pages: buildPages("issue2", 22) },
            "3":    { title: "Confruntarea // Volumul I", badge: "ISSUE #03", pages: buildPages("issue3", 24) },
            "4":    { title: "Infiltrarea // Volumul I", badge: "ISSUE #04", pages: buildPages("issue4", 25) },
            "5":    { title: "Alianța Secretă // Volumul I", badge: "ISSUE #05", pages: buildPages("issue5", 25) },
            "6":    { title: "Dead Drop: Terminal Protocol Part 1", badge: "ISSUE #06", pages: buildPages("issue6", 24) },
            "7":    { title: "Dead Drop: Terminal Protocol Part 2", badge: "ISSUE #07", pages: buildPages("issue7", 24) },
            "8":    { title: "Dead Drop - Terminal Protocol Part 3", badge: "ISSUE #08", pages: buildPages("issue8", 26) },
            "9":    { title: "Dead Drop: Zero Collateral", badge: "ISSUE #09", pages: buildPages("issue9", 27) },
            "10":   { title: "Căutarea // Volumul II", badge: "ISSUE #10", pages: buildPages("issue10", 29) },
            "11_1": { title: "Dead Drop - The New Order Part 1", badge: "ISSUE #11 [PT 1]", pages: buildPages("issue11_p1", 25) },
            "11_2": { title: "Dead Drop - The New Order Part 2", badge: "ISSUE #11 [PT 2]", pages: buildPages("issue11_p2", 36) },
            "12":   { title: "Dead Drop - The Game", badge: "ISSUE #12", pages: buildPages("issue12", 50) },
            "13":   { title: "Dead Drop - Open Season", badge: "ISSUE #13", pages: buildPages("issue13", 51) }
        };

</script>
<script src="/assets/reader.js"></script>
</body>
</html>
