<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VA Comics // MEDIA // VIDEO_PROMOS</title>
    <!-- SEO:START -->
    <meta name="description" content="Watch the official Dead Drop teasers, trailers and music videos from VA Comics.">
    <link rel="canonical" href="https://va-comics.com/media/video">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="VA Comics">
    <meta property="og:title" content="Dead Drop Video Promos // VA Comics">
    <meta property="og:description" content="Watch the official Dead Drop teasers, trailers and music videos from VA Comics.">
    <meta property="og:url" content="https://va-comics.com/media/video">
    <meta property="og:image" content="https://va-comics.com/og-image.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:locale" content="en_US">
    <meta name="theme-color" content="#050505">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <!-- SEO:END -->
    <link rel="stylesheet" href="../style.css">
    <style>
        /* CONFIGURAȚIE CONSOLA VIDEO GRID */
        .video-terminal-container {
            width: 100%;
            max-width: 1100px;
            display: grid;
            grid-template-columns: 1fr;
            gap: 30px;
        }

        @media (min-width: 900px) {
            .video-terminal-container {
                grid-template-columns: 1.4fr 0.6fr; /* Coloana 1: Ecranul Mare, Coloana 2: Lista Teasere */
            }
        }

        .main-screen-box, .video-feed-selector {
            padding: 20px;
            position: relative;
        }

        .main-screen-box::before {
            content: "MONITOR_DISPLAY // TRANSMISSION_LIVE";
            position: absolute;
            top: -10px;
            left: 20px;
            background: #050505;
            padding: 0 10px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 11px;
            color: var(--magma-orange);
            letter-spacing: 1px;
        }

        .video-feed-selector::before {
            content: "CHANNELS // AVAILABLE_LOGS";
            position: absolute;
            top: -10px;
            left: 20px;
            background: #050505;
            padding: 0 10px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 11px;
            color: var(--terminal-gray);
            letter-spacing: 1px;
        }

        /* Container Proporțional 16:9 Cinema Purtat de Sistem */
        .video-theater-screen {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%; /* Raport 16:9 perfect */
            height: 0;
            background: #000000;
            border: 1px solid #111;
        }

        .video-frame-hidden {
            display: none !important;
        }

        /* Preview image: the YouTube player loads only after a click */
        .video-facade {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 0;
            padding: 0;
            background-color: #000000;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            cursor: pointer;
        }

        .video-facade::before {
            content: "";
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.45);
            transition: background 0.2s ease;
        }

        .video-facade:hover::before {
            background: rgba(0, 0, 0, 0.25);
        }

        .facade-play {
            position: relative;
            padding: 14px 26px;
            background: rgba(0, 0, 0, 0.75);
            border: 1px solid var(--magma-orange);
            color: var(--magma-orange);
            font-family: 'Courier New', Courier, monospace;
            font-size: 16px;
            font-weight: bold;
            letter-spacing: 3px;
        }

        .facade-title {
            position: absolute;
            left: 16px;
            bottom: 14px;
            right: 16px;
            text-align: left;
            font-family: 'Courier New', Courier, monospace;
            font-size: 12px;
            letter-spacing: 1px;
            color: #ffffff;
            z-index: 1;
        }

        .video-theater-screen iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }

        /* Listă tactică de selecție video cu scroll controlat */
        .feed-nodes-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 10px;
            max-height: 65vh;
            overflow-y: auto;
            scrollbar-width: thin;
            scrollbar-color: var(--magma-orange) #000;
        }

        .feed-nodes-list::-webkit-scrollbar {
            width: 4px;
        }

        .feed-nodes-list::-webkit-scrollbar-track {
            background: #050505;
        }

        .feed-nodes-list::-webkit-scrollbar-thumb {
            background: var(--magma-orange);
            border-radius: 2px;
        }

        .feed-node-item {
            font-family: 'Courier New', Courier, monospace;
            font-size: 13px;
            color: var(--terminal-gray);
            border: 1px solid #111;
            background: rgba(0, 0, 0, 0.4);
            padding: 15px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .feed-node-item:hover {
            border-color: var(--terminal-gray);
            color: var(--text-colorless);
            background: rgba(5, 5, 5, 0.8);
        }

        .feed-node-item.node-active {
            border-color: var(--magma-orange) !important;
            color: var(--text-colorless);
            background: var(--pure-black);
            box-shadow: inset 0 0 10px rgba(255, 69, 0, 0.1);
        }

        .feed-node-item .feed-title {
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: color 0.2s ease;
        }

        .feed-node-item.node-active .feed-title {
            color: var(--magma-orange);
        }

        .feed-node-item .feed-meta {
            font-size: 11px;
            color: var(--terminal-gray);
        }

        .media-header-title {
            font-size: 24px;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--magma-orange);
            margin-bottom: 30px;
            border-bottom: 1px solid var(--dark-fence);
            padding-bottom: 10px;
        }
    </style>
</head>
<body class="content-page">

    <div class="bunker-bg-overlay"></div>

    <button class="mobile-bunker-toggle">
        [ = ] SYS_MENU
    </button>

    <div class="os-container">
        
        <nav class="sidebar-nav" id="globalNav"></nav>
    <script src="/site.js"></script>

        <div class="content-wrapper">
            
            <h1 class="media-header-title">Video Promos // Visual Operations</h1>

            <div class="video-terminal-container">
                
                <div class="main-screen-box">
                    <div class="video-theater-screen">
                        <button type="button" class="video-facade" id="videoFacade" aria-label="Play video">
                            <span class="facade-title" id="facadeTitle"></span>
                            <span class="facade-play">[ &#9654; PLAY ]</span>
                        </button>
                        <iframe id="videoMonitor" 
                                class="video-frame-hidden"
                                title="Dead Drop Video Player"
                                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                                allowfullscreen></iframe>
                    </div>
                </div>

                <div class="video-feed-selector">
                    <ul class="feed-nodes-list" id="videoNodesList"></ul>
                </div>

            </div>
        </div>

        <footer class="bunker-footer" id="siteFooter"></footer>

    </div>

    <script>

        // BAZA DE DATE MULTIMEDIA
        const VIDEO_DATABASE = [
    {
        type: "single",
        id: "8iKy3zE2HBs",
        title: "Dead Drop - The Hunt",
        meta: "PROTOCOL: OVERVIEW // SECURE_STREAM"
    },
    {
        type: "single",
        id: "Sd7--V8R1ks",
        title: "Teaser General // Dead Drop",
        meta: "PROTOCOL: OVERVIEW // SECURE_STREAM"
    },
    {
        type: "single",
        id: "pzDrUI8Jr7Q",
        title: "Teaser Issue #12 // The Game",
        meta: "PROTOCOL: DATA_UPDATE // LAUNCH_PROMO"
    },
    {
        type: "single",
        id: "EzFSBHuSoIk",
        title: "Official Video // Terminus City",
        meta: "PROTOCOL: TRACK_RELEASE // MELODIC_DEATH_METAL"
    },
    {
        type: "playlist",
        id: "PL7uIs3aHHCVHBqWa_5UHw__PntAHUyNdf",
        title: "Official Soundtrack // Full Playlist",
        meta: "PROTOCOL: AUDIO_SYNTH // SUNO_TRACKS_DATABASE"
    },
    {
        type: "single",
        id: "ziSLKUwBVjY",
        title: "Teaser Issue #13 // Open Season",
        meta: "PROTOCOL: DATA_UPDATE // LAUNCH_PROMO"
    }
];

        const monitor = document.getElementById('videoMonitor');
        const videoListContainer = document.getElementById('videoNodesList');

        const facade = document.getElementById('videoFacade');
        const facadeTitle = document.getElementById('facadeTitle');
        let currentClip = null;

        function buildEmbedUrl(clip, autoplay) {
            const ap = autoplay ? '&autoplay=1' : '';
            if (clip.type === "playlist") {
                return `https://www.youtube-nocookie.com/embed/videoseries?list=${clip.id}&rel=0${ap}`;
            }
            return `https://www.youtube-nocookie.com/embed/${clip.id}?rel=0${ap}`;
        }

        // Shows only a preview image. No YouTube player is loaded until the visitor clicks.
        function showFacade(clip) {
            currentClip = clip;
            monitor.removeAttribute('src');
            monitor.classList.add('video-frame-hidden');
            facade.style.display = 'flex';
            facade.style.backgroundImage = (clip.type === 'playlist') ? 'none' : `url(https://i.ytimg.com/vi/${clip.id}/hqdefault.jpg)`;
            facadeTitle.textContent = clip.title;
        }

        function playClip(clip) {
            currentClip = clip;
            facade.style.display = 'none';
            monitor.classList.remove('video-frame-hidden');
            monitor.setAttribute('src', buildEmbedUrl(clip, true));
        }

        facade.addEventListener('click', () => {
            if (currentClip) playClip(currentClip);
        });

        function initVideoHub() {
            videoListContainer.innerHTML = '';
            if (VIDEO_DATABASE.length === 0) return;

            // First clip: preview only (nothing is loaded from YouTube yet)
            showFacade(VIDEO_DATABASE[0]);

            VIDEO_DATABASE.forEach((clip, index) => {
                const li = document.createElement('li');
                li.className = `feed-node-item ${index === 0 ? 'node-active' : ''}`;

                li.innerHTML = `
                    <span class="feed-title">> ${clip.title}</span>
                    <span class="feed-meta">${clip.meta}</span>
                `;

                li.addEventListener('click', () => {
                    playClip(clip);

                    document.querySelectorAll('.feed-node-item').forEach(node => {
                        node.classList.remove('node-active');
                    });
                    li.classList.add('node-active');
                });

                videoListContainer.appendChild(li);
            });
        }

        window.addEventListener('DOMContentLoaded', () => {
            initVideoHub();
        });
    </script>
</body>
</html>
