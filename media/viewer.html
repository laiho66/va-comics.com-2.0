    <style>
        :root {
            --magma-orange: #ff4500;
            --terminal-gray: #888888;
            --dark-fence: #222222;
        }

        /* Selectorul de Numere (Issues) stabilizat pentru Desktop și Mobile */
        .issue-selector-hud {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
            padding: 18px 15px 15px 15px;
            border: 1px dashed var(--dark-fence, #222);
            background: rgba(0, 0, 0, 0.6);
            position: relative;
            width: 100%;
            max-width: 1050px;
            box-sizing: border-box;
            overflow-x: auto;
            overflow-y: hidden;
            scrollbar-width: thin;
            scrollbar-color: var(--magma-orange) #050505;
            -webkit-overflow-scrolling: touch;
        }

        /* Scrollbar gros de 10px, mereu vizibil pe Desktop */
        .issue-selector-hud::-webkit-scrollbar {
            height: 10px;
        }

        .issue-selector-hud::-webkit-scrollbar-track {
            background: #050505;
            border: 1px solid #1a1a1a;
        }

        .issue-selector-hud::-webkit-scrollbar-thumb {
            background: var(--magma-orange);
            border-radius: 0;
            cursor: pointer;
        }

        .issue-selector-hud::-webkit-scrollbar-thumb:hover {
            background: #ff5e22;
        }

        .issue-selector-hud::before {
            content: "SELECT_ACTIVE_DATABASE_NODE (ISSUES_ARCHIVE)";
            position: absolute;
            top: -10px;
            left: 15px;
            background: #050505;
            padding: 0 8px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 10px;
            color: var(--terminal-gray, #888);
            letter-spacing: 1px;
            z-index: 10;
        }

        .issue-btn {
            background: rgba(10, 10, 10, 0.8);
            border: 1px solid var(--dark-fence, #222);
            color: var(--terminal-gray, #888);
            font-family: 'Courier New', Courier, monospace;
            font-size: 11px;
            font-weight: bold;
            padding: 6px 14px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-transform: uppercase;
            flex-shrink: 0;
        }

        .issue-btn:hover {
            color: #ffffff;
            border-color: var(--terminal-gray, #888);
            background: rgba(30, 30, 30, 0.5);
        }

        .issue-btn.active-issue {
            color: #000000 !important;
            background: var(--magma-orange, #ff4500) !important;
            border-color: var(--magma-orange, #ff4500) !important;
            box-shadow: 0 0 10px rgba(255, 69, 0, 0.4);
        }

        .viewer-terminal-container {
            width: 100%;
            max-width: 1050px;
            display: flex;
            flex-direction: row;
            gap: 25px;
            align-items: flex-start;
        }

        /* COLOANA STÂNGA: SELECTORUL DE NODURI */
        .thumbnails-grid-hud {
            display: flex;
            flex-direction: column; 
            gap: 15px;
            position: relative;
            padding: 25px 15px 15px 15px;
            border: 1px solid var(--dark-fence, #222);
            background: rgba(0, 0, 0, 0.3);
            width: 135px; 
            max-height: 75vh;
            overflow-y: auto;
            flex-shrink: 0;
            box-sizing: border-box;
            scrollbar-width: thin;
            scrollbar-color: var(--magma-orange) #000;
        }

        .thumbnails-grid-hud::-webkit-scrollbar {
            width: 4px;
        }

        .thumbnails-grid-hud::-webkit-scrollbar-track {
            background: #050505;
        }

        .thumbnails-grid-hud::-webkit-scrollbar-thumb {
            background: var(--magma-orange);
            border-radius: 2px;
        }

        .thumbnails-grid-hud::before {
            content: "NODES";
            position: absolute;
            top: -10px;
            left: 15px;
            background: #050505;
            padding: 0 8px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 11px;
            color: var(--terminal-gray, #888);
            letter-spacing: 1px;
            z-index: 10;
        }

        .thumb-node {
            width: 100%;
            aspect-ratio: 2/3; 
            object-fit: cover;
            background: #000000;
            border: 1px solid #151515;
            cursor: pointer;
            transition: all 0.2s ease;
            opacity: 0.5;
            display: block;
        }

        .thumb-node:hover {
            opacity: 0.9;
            border-color: var(--terminal-gray, #888);
        }

        .thumb-node.node-selected {
            opacity: 1 !important;
            border-color: var(--magma-orange, #ff4500) !important;
            box-shadow: 0 0 10px rgba(255, 69, 0, 0.3);
        }

        /* COLOANA DREAPTA: MONITORUL HUD PRINCIPAL */
        .main-display-box {
            flex-grow: 1; 
            padding: 15px;
            position: relative;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid var(--dark-fence, #222);
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
        }

        .main-display-box::before {
            content: "IMAGE_VIEWER // HIGH_RESOLUTION_FEED";
            position: absolute;
            top: -10px;
            left: 20px;
            background: #050505;
            padding: 0 10px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 11px;
            color: var(--magma-orange, #ff4500);
            letter-spacing: 1px;
            z-index: 10;
        }

        .viewport-container {
            position: relative;
            width: 100%;
            background: #000000;
            border: 1px solid #111;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 50vh;
        }

        .active-image-frame {
            width: auto;
            max-width: 100%;
            max-height: 65vh; 
            object-fit: contain;
            display: block;
            margin: 0 auto;
        }

        .vector-comic-sandbox {
            width: 100%;
            height: 65vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .nav-overlay-zone {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 20%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            opacity: 0;
            transition: opacity 0.2s ease;
            z-index: 5;
            background: linear-gradient(to right, rgba(0,0,0,0.5) 0%, rgba(0,0,0,0) 100%);
        }

        .nav-overlay-zone.zone-right {
            right: 0;
            background: linear-gradient(to left, rgba(0,0,0,0.5) 0%, rgba(0,0,0,0) 100%);
        }

        .nav-overlay-zone:hover {
            opacity: 1;
        }

        .nav-arrow-indicator {
            background: rgba(0, 0, 0, 0.9);
            border: 1px solid var(--magma-orange, #ff4500);
            color: var(--magma-orange, #ff4500);
            font-family: monospace;
            padding: 8px 12px;
            font-size: 13px;
            pointer-events: none;
            letter-spacing: 1px;
        }

        .viewer-control-hud {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            background: rgba(5, 5, 5, 0.95);
            border: 1px solid var(--dark-fence, #222);
            font-family: 'Courier New', Courier, monospace;
            font-size: 12px;
            color: var(--terminal-gray, #888);
            flex-wrap: wrap;
            gap: 10px;
        }

        .hud-page-indicator {
            color: #ffffff;
            font-weight: bold;
        }

        .hud-navigation-buttons {
            display: flex;
            gap: 10px;
        }

        .hud-nav-btn {
            background: transparent;
            border: 1px solid var(--dark-fence, #222);
            color: var(--terminal-gray, #888);
            padding: 6px 14px;
            cursor: pointer;
            font-family: monospace;
            font-size: 11px;
            transition: all 0.2s ease;
        }

        .hud-nav-btn:hover:not(:disabled) {
            color: var(--magma-orange, #ff4500);
            border-color: var(--magma-orange, #ff4500);
        }

        .hud-nav-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .media-header-title {
            font-size: 24px;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--magma-orange, #ff4500);
            margin-bottom: 20px;
            border-bottom: 1px solid var(--dark-fence, #222);
            padding-bottom: 10px;
        }

        /* END-OF-ISSUE CALL TO ACTION */
        .end-cta {
            padding: 22px 18px 18px 18px;
            border: 1px dashed var(--magma-orange, #ff4500);
            background: rgba(255, 69, 0, 0.04);
            position: relative;
        }

        .end-cta-tag {
            position: absolute;
            top: -10px;
            left: 15px;
            background: #050505;
            padding: 0 8px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 11px;
            letter-spacing: 1px;
            color: var(--magma-orange, #ff4500);
        }

        .end-cta-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
        }

        .end-cta-btn {
            display: inline-block;
            padding: 12px 18px;
            background: transparent;
            border: 1px solid #ffffff;
            color: #ffffff;
            font-family: 'Courier New', Courier, monospace;
            font-size: 12px;
            font-weight: bold;
            letter-spacing: 1px;
            text-transform: uppercase;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .end-cta-btn.primary {
            border-color: var(--magma-orange, #ff4500);
            color: var(--magma-orange, #ff4500);
        }

        .end-cta-btn:hover {
            background: #000000;
            border-color: var(--magma-orange, #ff4500);
            color: var(--magma-orange, #ff4500);
        }

        .end-cta-note {
            font-family: 'Courier New', Courier, monospace;
            font-size: 12px;
            letter-spacing: 1px;
            color: var(--terminal-gray, #888);
        }

        @media (max-width: 768px) {
            .end-cta-btn { flex: 1 1 100%; text-align: center; }
        }

        /* COMPATIBILITATE MOBIL */
        @media (max-width: 768px) {
            #btnFullscreen {
                display: none !important;
            }

            .issue-selector-hud {
                padding: 12px 10px !important;
                margin-bottom: 15px !important;
            }

            .issue-btn {
                padding: 6px 12px !important;
                font-size: 10px !important;
            }

            .viewer-terminal-container {
                flex-direction: column !important; 
                gap: 20px !important;
                width: 100% !important;
            }

            .main-display-box {
                padding: 10px !important;
                width: 100% !important;
                display: flex !important;
                flex-direction: column !important;
            }
            
            .viewport-container {
                display: block !important;
                width: 100% !important;
                min-height: auto !important;
                height: auto !important;
                text-align: center !important;
            }

            .active-image-frame {
                display: block !important;
                width: 100% !important;
                max-width: 100% !important;
                min-width: 100% !important;
                height: auto !important;
                max-height: 70vh !important;
                object-fit: contain !important;
                margin: 0 auto !important;
            }
            
            .vector-comic-sandbox {
                height: 45vh;
            }

            .thumbnails-grid-hud {
                width: 100% !important;
                max-height: none !important;
                flex-direction: row !important; 
                overflow-x: auto !important;
                overflow-y: hidden !important;
                justify-content: flex-start !important;
                padding: 20px 10px 10px 10px !important;
                gap: 10px !important;
            }

            .thumbnails-grid-hud::before {
                content: "AVAILABLE_NODES // PAGES";
            }

            .thumb-node {
                width: 65px !important; 
                height: 95px !important; 
                flex-shrink: 0 !important;
            }

            .nav-overlay-zone {
                width: 30% !important; 
            }

            .nav-arrow-indicator {
                font-size: 11px !important;
                padding: 6px 10px !important;
            }
        }
    </style>
</head>
<body class="content-page">

                <div class="thumbnails-grid-hud" id="nodesContainer"></div>

                <div class="main-display-box">
                    
                    <div class="viewport-container">

    <script>

        // 1. LINK BAZĂ CLOUDFLARE R2
        const R2_BASE_URL = "https://pub-b3a8a09f297e48cfaca67d22b3826089.r2.dev/deaddrop";

        // Generator pagini (page1.webp -> totalPages)
        function buildPages(folderName, totalPages) {
            var pages = [];
            for (var i = 1; i <= totalPages; i++) {
                pages.push(R2_BASE_URL + "/" + folderName + "/page" + i + ".webp");
            }
            return pages;
        }

        // 2. BAZA DE DATE CONFIGURATĂ
        const COMICS_DATABASE = {
            "1":    { title: "Originea // Volumul I", badge: "ISSUE #01", pages: buildPages("issue1", 23) },
            "2":    { title: "Dead Drop: Ghost Mark", badge: "ISSUE #02", pages: buildPages("issue2", 22) },
            "3":    { title: "Confruntarea // Volumul I", badge: "ISSUE #03", pages: buildPages("issue3", 24) },
            "4":    { title: "Infiltrarea // Volumul I", badge: "ISSUE #04", pages: buildPages("issue4", 25) },
            "5":    { title: "Alianța Secretă // Volumul I", badge: "ISSUE #05", pages: buildPages("issue5", 25) },
            "6":    { title: "Dead Drop: Terminal Protocol Part 1", badge: "ISSUE #06", pages: buildPages("issue6", 24) },
            "7":    { title: "Dead Drop: Terminal Protocol Part 2", badge: "ISSUE #07", pages: buildPages("issue7", 24) },
            "8":    { title: "Dead Drop - Terminal Protocol Part 3", badge: "ISSUE #08", pages: buildPages("issue8", 26) },
            "9":    { title: "Dead Drop: Zero Collateral", badge: "ISSUE #09", pages: buildPages("issue9", 27) },
            "10":   { title: "Căutarea // Volumul II", badge: "ISSUE #10", pages: buildPages("issue10", 29) },
            "11_1": { title: "Dead Drop - The New Order Part 1", badge: "ISSUE #11 [PT 1]", pages: buildPages("issue11_p1", 25) },
            "11_2": { title: "Dead Drop - The New Order Part 2", badge: "ISSUE #11 [PT 2]", pages: buildPages("issue11_p2", 36) },
            "12":   { title: "Dead Drop - The Game", badge: "ISSUE #12", pages: buildPages("issue12", 50) },
            "13":   { title: "Dead Drop - Open Season", badge: "ISSUE #13", pages: buildPages("issue13", 51) }
        };

        // ORDERED ISSUE KEYS (a plain object would list "11_1" and "11_2" after "13")
        function sortedIssueKeys() {
            return Object.keys(COMICS_DATABASE).sort(function(a, b) {
                var pa = a.split('_'), pb = b.split('_');
                var d = (parseInt(pa[0], 10) || 0) - (parseInt(pb[0], 10) || 0);
                if (d !== 0) return d;
                return (parseInt(pa[1], 10) || 0) - (parseInt(pb[1], 10) || 0);
            });
        }

        // STATE MANAGEMENT
        let viewerState = { 
            activeIssue: "1", 
            activePage: 1 
        };

        // DOM SELECTION
        const displayImage = document.getElementById('mainViewerDisplay');
        const vectorSandbox = document.getElementById('vectorComicSandbox');
        const nodesContainer = document.getElementById('nodesContainer');
        const issueSelector = document.getElementById('issueSelector');
        const hudIssueLabel = document.getElementById('hudActiveIssueLabel');
        const hudPageIndicator = document.getElementById('hudPageIndicator');
        const btnPrev = document.getElementById('btnPrevNode');
        const btnNext = document.getElementById('btnNextNode');
        const btnFullscreen = document.getElementById('btnFullscreen');
        const viewerContainer = document.getElementById('viewerContainer');
        const zoneLeft = document.getElementById('zoneLeft');
        const zoneRight = document.getElementById('zoneRight');

        function buildIssueSelector() {
            if (!issueSelector) return;
            issueSelector.innerHTML = '';
            
            sortedIssueKeys().forEach(function(key) {
                const item = COMICS_DATABASE[key];
                const btn = document.createElement('button');
                btn.type = "button";
                btn.className = 'issue-btn' + (String(key) === String(viewerState.activeIssue) ? ' active-issue' : '');
                btn.id = 'issue-btn-' + key;
                btn.innerHTML = '[ ' + item.badge + ' ]';
                btn.addEventListener('click', function() {
                    switchIssue(key);
                });
                issueSelector.appendChild(btn);
            });

            // Permite scroll orizontal lin cu rotița mouse-ului direct pe selector
            issueSelector.addEventListener('wheel', function(e) {
                if (e.deltaY !== 0) {
                    e.preventDefault();
                    issueSelector.scrollLeft += e.deltaY;
                }
            }, { passive: false });
        }

        function loadIssue(issueId, startPage) {
            viewerState.activeIssue = String(issueId);
            var startNum = parseInt(startPage, 10);
            var issueObj = COMICS_DATABASE[viewerState.activeIssue];
            var maxPages = issueObj ? issueObj.pages.length : 0;
            viewerState.activePage = (startNum >= 1 && startNum <= maxPages) ? startNum : 1;

            const buttons = document.querySelectorAll('.issue-btn');
            buttons.forEach(function(btn) {
                if (btn.id === 'issue-btn-' + viewerState.activeIssue) {
                    btn.classList.add('active-issue');
                    
                    // Scroll orizontal STRICT în cadrul containerului, fără să afecteze ecranul
                    if (issueSelector) {
                        const targetLeft = btn.offsetLeft - issueSelector.offsetLeft;
                        const centerPos = targetLeft - (issueSelector.clientWidth / 2) + (btn.clientWidth / 2);
                        issueSelector.scrollTo({
                            left: Math.max(0, centerPos),
                            behavior: 'smooth'
                        });
                    }
                } else {
                    btn.classList.remove('active-issue');
                }
            });

            if (hudIssueLabel) {
                hudIssueLabel.textContent = COMICS_DATABASE[viewerState.activeIssue] ? COMICS_DATABASE[viewerState.activeIssue].badge : ('ISSUE #' + viewerState.activeIssue);
            }
            
            renderNodesList();
            renderActivePage();
        }

        function switchIssue(issueId) {
            if (COMICS_DATABASE[issueId]) {
                loadIssue(issueId);
            }
        }

        function renderNodesList() {
            if (!nodesContainer) return;
            nodesContainer.innerHTML = '';
            const issueData = COMICS_DATABASE[viewerState.activeIssue];
            const pages = issueData ? issueData.pages : [];
            const total = pages.length;

            if (total === 0) {
                nodesContainer.innerHTML = '<span style="color:#ff4500; font-size:10px; font-family:monospace; padding:10px;">NO DATA</span>';
                return;
            }

            for (let i = 1; i <= total; i++) {
                const imgNode = document.createElement('img');
                imgNode.className = 'thumb-node' + (i === viewerState.activePage ? ' node-selected' : '');
                imgNode.alt = 'Node Page ' + i;
                imgNode.setAttribute('data-page-index', i);
                imgNode.loading = 'lazy';
                imgNode.decoding = 'async';
                imgNode.src = pages[i - 1];

                imgNode.addEventListener('click', function() {
                    selectPage(i);
                });

                nodesContainer.appendChild(imgNode);
            }
        }

        function selectPage(pageIndex) {
            const pages = COMICS_DATABASE[viewerState.activeIssue] ? COMICS_DATABASE[viewerState.activeIssue].pages : [];
            if (pageIndex >= 1 && pageIndex <= pages.length) {
                viewerState.activePage = pageIndex;
                
                const thumbnails = document.querySelectorAll('.thumb-node');
                thumbnails.forEach(function(thumb, idx) {
                    if (idx + 1 === pageIndex) {
                        thumb.classList.add('node-selected');
                        thumb.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'nearest' });
                    } else {
                        thumb.classList.remove('node-selected');
                    }
                });

                renderActivePage();
            }
        }

        function renderActivePage() {
            const pages = COMICS_DATABASE[viewerState.activeIssue] ? COMICS_DATABASE[viewerState.activeIssue].pages : [];
            const current = viewerState.activePage;
            const total = pages.length;

            if (total === 0) {
                if (hudPageIndicator) hudPageIndicator.textContent = '[PAGE 00 / 00]';
                if (btnPrev) btnPrev.disabled = true;
                if (btnNext) btnNext.disabled = true;
                if (displayImage) displayImage.style.display = 'none';
                if (vectorSandbox) {
                    vectorSandbox.style.display = 'flex';
                    vectorSandbox.innerHTML = generateBunkerComicPanelSVG(viewerState.activeIssue, 0);
                }
                return;
            }

            if (hudPageIndicator) {
                hudPageIndicator.textContent = '[PAGE ' + String(current).padStart(2, '0') + ' / ' + String(total).padStart(2, '0') + ']';
            }
            if (btnPrev) btnPrev.disabled = (current === 1);
            if (btnNext) btnNext.disabled = (current === total);

            updateEndCta(current, total);
            syncUrl();
            preloadNeighbors(pages, current);

            const activeImageSrc = pages[current - 1];

            if (activeImageSrc && displayImage) {
                displayImage.src = activeImageSrc;
                displayImage.style.display = 'block';
                if (vectorSandbox) vectorSandbox.style.display = 'none';
                
                displayImage.onerror = function() {
                    displayImage.style.display = 'none';
                    if (vectorSandbox) {
                        vectorSandbox.style.display = 'flex';
                        vectorSandbox.innerHTML = generateBunkerComicPanelSVG(viewerState.activeIssue, current);
                    }
                };
            }
        }

        function navigatePage(direction) {
            const pages = COMICS_DATABASE[viewerState.activeIssue] ? COMICS_DATABASE[viewerState.activeIssue].pages : [];
            const targetPage = viewerState.activePage + direction;
            if (targetPage >= 1 && targetPage <= pages.length) {
                selectPage(targetPage);
            }
        }

        if (btnPrev) btnPrev.addEventListener('click', function() { navigatePage(-1); });
        if (btnNext) btnNext.addEventListener('click', function() { navigatePage(1); });
        if (zoneLeft) zoneLeft.addEventListener('click', function() { navigatePage(-1); });
        if (zoneRight) zoneRight.addEventListener('click', function() { navigatePage(1); });

        if (btnFullscreen) {
            btnFullscreen.addEventListener('click', function() {
                if (viewerContainer.requestFullscreen) {
                    if (!document.fullscreenElement) {
                        viewerContainer.requestFullscreen().then(function() {
                            btnFullscreen.textContent = "[ X ] EXIT_FULL";
                            btnFullscreen.style.color = "var(--magma-orange)";
                        }).catch(function(err) {
                            console.error('Eroare Fullscreen: ' + err.message);
                        });
                    } else {
                        document.exitFullscreen();
                    }
                } else {
                    viewerContainer.classList.toggle('pseudo-fullscreen');
                    if (viewerContainer.classList.contains('pseudo-fullscreen')) {
                        btnFullscreen.textContent = "[ X ] EXIT_FULL";
                        btnFullscreen.style.color = "var(--magma-orange)";
                    } else {
                        btnFullscreen.textContent = "[ + ] FULL_SCREEN";
                        btnFullscreen.style.color = "var(--terminal-gray)";
                    }
                }
            });
        }

        document.addEventListener('fullscreenchange', function() {
            if (!document.fullscreenElement && btnFullscreen) {
                btnFullscreen.textContent = "[ + ] FULL_SCREEN";
                btnFullscreen.style.color = "var(--terminal-gray)";
            }
        });

        function generateBunkerComicPanelSVG(issueNum, pageNum) {
            return `
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 700" class="w-full h-full max-h-[65vh]" style="background:#030303; border: 1px solid #ff450044;">
                    <rect width="100%" height="100%" fill="#030303" />
                    <line x1="20" y1="30" x2="480" y2="30" stroke="#ff4500" stroke-width="1" opacity="0.3"/>
                    <text x="25" y="23" fill="#ff4500" font-family="'Courier New', monospace" font-size="10" letter-spacing="1">// NODE_${issueNum} // PAGE_${String(pageNum).padStart(2,'0')}</text>
                    <g transform="translate(20, 100)">
                        <rect width="460" height="400" fill="#060606" stroke="#ff4500" stroke-width="1" opacity="0.6"/>
                        <text x="230" y="190" fill="#888888" font-family="monospace" font-size="12" text-anchor="middle">// FEED OFFLINE</text>
                        <text x="230" y="215" fill="#ff4500" font-family="monospace" font-size="10" text-anchor="middle">AȘTEPTARE DATE R2 BUCKET</text>
                    </g>
                </svg>
            `;
        }

        // KEEP THE ADDRESS BAR IN SYNC (?issue=13&page=5), so a page can be shared
        function syncUrl() {
            try {
                var q = new URLSearchParams(window.location.search);
                q.set('issue', viewerState.activeIssue);
                q.set('page', viewerState.activePage);
                history.replaceState(null, '', window.location.pathname + '?' + q.toString() + window.location.hash);
            } catch (e) { /* ignore */ }
        }

        // PRELOAD THE NEXT TWO PAGES FOR INSTANT PAGE TURNS
        function preloadNeighbors(pages, current) {
            [current, current + 1].forEach(function(i) {
                if (i >= 1 && i < pages.length) {
                    var img = new Image();
                    img.src = pages[i];
                }
            });
        }

        // END-OF-ISSUE BOX: next issue + where to buy
        function updateEndCta(current, total) {
            var box = document.getElementById('endCta');
            if (!box) return;
            if (current !== total) { box.style.display = 'none'; return; }

            var keys = sortedIssueKeys();
            var idx = keys.indexOf(String(viewerState.activeIssue));
            var item = COMICS_DATABASE[viewerState.activeIssue];
            var nextKey = (idx >= 0 && idx < keys.length - 1) ? keys[idx + 1] : null;
            var volPage = (parseInt(viewerState.activeIssue, 10) <= 8) ? '/deaddrop/vol1.html' : '/deaddrop/vol2.html';

            var html = '<div class="end-cta-tag">END_OF_TRANSMISSION // ' + item.badge + '</div><div class="end-cta-actions">';
            if (nextKey) {
                html += '<button type="button" class="end-cta-btn primary" id="ctaNext">[ NEXT: ' + COMICS_DATABASE[nextKey].badge + ' ]</button>';
            } else {
                html += '<span class="end-cta-note">END OF AVAILABLE ISSUES</span>';
            }
            html += '<a class="end-cta-btn" href="' + volPage + '">[ GET THIS ISSUE // AMAZON ]</a></div>';
            box.innerHTML = html;
            box.style.display = 'block';

            var nextBtn = document.getElementById('ctaNext');
            if (nextBtn) {
                nextBtn.addEventListener('click', function() {
                    switchIssue(nextKey);
                    var area = document.querySelector('.viewport-container');
                    if (area && area.scrollIntoView) area.scrollIntoView({ behavior: 'smooth', block: 'start' });
                });
            }
        }

        // SWIPE LEFT / RIGHT ON TOUCH SCREENS
        (function() {
            var area = document.querySelector('.viewport-container');
            if (!area) return;
            var sx = 0, sy = 0;
            area.addEventListener('touchstart', function(e) {
                var t = e.changedTouches[0];
                sx = t.clientX; sy = t.clientY;
            }, { passive: true });
            area.addEventListener('touchend', function(e) {
                var t = e.changedTouches[0];
                var dx = t.clientX - sx, dy = t.clientY - sy;
                if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.5) {
                    navigatePage(dx < 0 ? 1 : -1);
                }
            }, { passive: true });
        })();

        document.addEventListener('keydown', function(event) {
            if (event.key === "ArrowRight") navigatePage(1);
            else if (event.key === "ArrowLeft") navigatePage(-1);
        });

        function initReader() {
            buildIssueSelector();
            const urlParams = new URLSearchParams(window.location.search);
            const issueParam = urlParams.get('issue');
            if (issueParam && COMICS_DATABASE[issueParam]) {
                viewerState.activeIssue = String(issueParam);
            }
            loadIssue(viewerState.activeIssue, urlParams.get('page'));
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initReader);
        } else {
            initReader();
        }
    </script>
</body>
</html>
