<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VA Comics // CONTACT // UPLINK_TERMINAL</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* CONFIGURAȚIE FORMULAR ȘI CONDUITE DE CONTACT */
        .contact-container {
            width: 100%;
            max-width: 900px;
            display: grid;
            grid-template-columns: 1fr;
            gap: 30px;
            margin-top: 40px;
        }

        @media (min-width: 768px) {
            .contact-container {
                grid-template-columns: 1fr;
            }
        }

        /* Hover calibrat pentru butonul de terminal Facebook */
        .btn-facebook-uplink:hover {
            border-color: var(--magma-orange) !important;
            color: var(--magma-orange) !important;
            background: var(--pure-black) !important;
            box-shadow: 0 0 15px rgba(255, 69, 0, 0.3);
        }

        /* FIX-UL GEOMETRIC MASTER (Alinierea sus, la linie cu meniul) */
        @media (min-width: 1024px) {
            .os-container {
                flex-direction: row;
                flex-wrap: nowrap;
                justify-content: flex-start !important;
                align-items: flex-start !important;
            }
            
            .sidebar-nav {
                width: 350px;
                flex-shrink: 0;
            }
            
            .content-wrapper {
                margin-left: 30px;
                margin-top: 40px; /* Ancorat la linie cu [01] HOME */
                width: 100%;
            }
        }
    </style>
</head>
<body class="content-page">

    <div class="bunker-bg-overlay"></div>

    <button class="mobile-bunker-toggle">
        [ = ] SYS_MENU
    </button>

    <div class="os-container">
        
        <nav class="sidebar-nav" id="globalNav"></nav>
    <script src="/site.js"></script>

        <div class="content-wrapper">
            <div style="width: 100%; max-width: 600px;">
                
                <div style="padding: 40px; position: relative; background: rgba(0, 0, 0, 0.85); border: 1px solid var(--dark-fence); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);">
                    
                    <div style="position: absolute; top: -10px; left: 20px; background: #050505; padding: 0 10px; font-family: 'Courier New', Courier, monospace; font-size: 11px; color: var(--magma-orange); letter-spacing: 1px;">
                        UPLINK_PROTOCOL // DIRECT_CONTACT
                    </div>

                    <div style="font-family: Arial, sans-serif; color: #dddddd; line-height: 1.6; text-align: center;">
                        <h2 style="color: #ffffff; font-size: 20px; margin-top: 10px; margin-bottom: 20px; text-transform: uppercase; letter-spacing: 1px;">
                            Connect via Social Network
                        </h2>
                        
                        <p style="margin-bottom: 30px; font-size: 14px; color: #aaaaaa;">
                            For business inquiries, project updates, feedback, or direct communication with VA Comics Studio, please access our official transmission channel on Facebook.
                        </p>

                        <a href="https://www.facebook.com/vacomics66" 
                           target="_blank" 
                           rel="noopener noreferrer" 
                           class="btn-facebook-uplink"
                           style="display: block; width: 100%; padding: 18px 0; background: transparent; border: 1px solid #ffffff; color: #ffffff; font-family: 'Courier New', Courier, monospace; font-size: 14px; font-weight: bold; text-transform: uppercase; text-decoration: none; letter-spacing: 2px; transition: all 0.3s ease; box-sizing: border-box;">
                            [ CONNECT_VIA_FACEBOOK ]
                        </a>
                    </div>

                </div>

            </div>
        </div>

        <footer class="bunker-footer" id="siteFooter"></footer>

    </div>

    
</body>
</html>
